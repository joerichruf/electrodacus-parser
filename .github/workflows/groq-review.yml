name: Groq Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Debug event
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Ref: ${{ github.ref }}"

      - uses: actions/checkout@v4

      - name: Setup Groq
        run: |
          pip install groq

      - name: Get diff of the pull request
        id: get_diff
        shell: bash
        env:
          DEFAULT_BRANCH: main
        run: |
          # Fetch the default branch
          git fetch origin "${{ env.DEFAULT_BRANCH }}"

          # Get diff excluding certain file types
          git diff "origin/${{ env.DEFAULT_BRANCH }}" -- ':(exclude)*.png' > "diff.txt"

          # Put multi-line string into an environment variable
          {
            echo "pull_request_diff<<EOF"
            cat "diff.txt"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Groq Code Review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIFF: ${{ steps.get_diff.outputs.pull_request_diff }}
        run: |
          python <<EOF
          import os
          from groq import Groq
          import requests

          client = Groq(api_key=os.environ["GROQ_API_KEY"])

          diff = os.environ.get("DIFF", "")
          if not diff.strip():
              print("No diff found.")
              exit(0)

          prompt = f"""
          You are a senior software engineer reviewing a pull request.
          Provide:
          - Bugs
          - Security issues
          - Performance concerns
          - Code improvements
          - Final summary

          Here is the diff:
          {diff[:12000]}
          """

          response = client.chat.completions.create(
              model="llama3-70b-8192",
              messages=[{"role": "user", "content": prompt}],
              temperature=0.2,
          )

          review = response.choices[0].message.content

          pr_number = os.environ.get("GITHUB_REF", "").split("/")[-2]

          repo = os.environ["GITHUB_REPOSITORY"]

          headers = {
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json"
          }

          url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"

          requests.post(url, headers=headers, json={"body": review})

          print("Review posted successfully.")
          EOF
