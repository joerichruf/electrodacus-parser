name: Copilot Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Copilot Review
        uses: github/copilot-review-action@v1
        with:
          # Optional: Configure review focus
          focus: security,performance,bugs
