[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrodacus-parser"
version = "0.1.0"
description = "Parse Electrodacus SBMS0 USB raw bit/byte data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["electrodacus", "sbms0", "usb", "parser"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
electrodacus-parser = "electrodacus_parser.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
