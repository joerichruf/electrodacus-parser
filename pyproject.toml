[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrodacus-parser"
version = "0.1.0"
description = "Parse Electrodacus SBMS0 USB raw bit/byte data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["electrodacus", "sbms0", "usb", "parser"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pre-commit>=3.5.0", "black>=24.0.0", "ruff>=0.3.0"]
mqtt = ["paho-mqtt>=2.0"]

[project.scripts]
electrodacus-parser = "electrodacus_parser.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["electrodacus_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
